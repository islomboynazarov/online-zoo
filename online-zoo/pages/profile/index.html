<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Online Zoo</title>

  <link rel="stylesheet" href="../../shared/styles/normalize.css">
  <link rel="stylesheet" href="../../shared/styles/global.css">
  <link rel="stylesheet" href="../../shared/styles/header.css">
  <link rel="stylesheet" href="../../shared/styles/footer.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="../../favicon.ico">
</head>

<body>

  <header class="header">
    <div class="container header__container">
      <div class="header__logo">
        <a href="../../pages/landing/index.html">
          <img src="../../assets/icons/ui/logo_zoo.png" alt="logo_zoo">
        </a>
      </div>
      <nav class="header__nav">
        <ul class="nav__list">
          <li><a href="../../pages/landing/index.html" class="nav__link">About</a></li>
          <li><a href="../../pages/map/index.html" class="nav__link">Map</a></li>
          <li><a href="../../pages/zoos/panda/index.html" class="nav__link">Zoos</a></li>
          <li><a href="../../pages/contact/index.html" class="nav__link">Contact Us</a></li>
        </ul>
      </nav>
      <div class="header__socials">
        <a href="#"><img src="../../assets/icons/social/youtube.png" alt="YouTube"></a>
        <a href="#"><img src="../../assets/icons/social/instagram.png" alt="Instagram"></a>
        <a href="#"><img src="../../assets/icons/social/facebook.png" alt="Facebook"></a>
      </div>
      <button class="header__burger" id="burger">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Dashboard code starts here  -->
  <main class="profile-page">
    <div class="db-wrap">

      <!-- SECTION 1: Profile Header Card -->
      <div class="glow-card">
        <div class="glow-card-inner" style="padding: 0;">
          <div class="db-header">
            <div class="db-avatar" id="db-avatar">I</div>
            <div class="db-info">
              <div class="db-name" id="db-name">Loading...</div>
              <div class="db-email" id="db-email"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- SECTION 2: Stats Row -->
      <div class="stats-row">
        <div class="stat-glow stat-glow--teal">
          <div class="stat-inner">
            <div class="stat-label">Total donated</div>
            <div class="stat-value" id="stat-total">$0</div>
          </div>
        </div>
        <div class="stat-glow stat-glow--orange">
          <div class="stat-inner">
            <div class="stat-label">Donations made</div>
            <div class="stat-value" id="stat-count">0</div>
          </div>
        </div>
        <div class="stat-glow stat-glow--purple">
          <div class="stat-inner">
            <div class="stat-label">Favourites</div>
            <div class="stat-value" id="stat-favs">0</div>
          </div>
        </div>
      </div>

      <!-- SECTION 3: Favourite Animals -->
      <div class="glow-card">
        <div class="glow-card-inner">
          <div class="section-head">
            <div class="section-title">Favourite animals</div>
            <div class="section-badge" id="favs-badge">0 of 4</div>
          </div>
          <!-- Generated by profile.ts -->
          <div class="animals-grid" id="animals-grid"></div>
        </div>
      </div>

      <!-- SECTION 4: Donation History -->
      <div class="glow-card">
        <div class="glow-card-inner">
          <div class="section-head">
            <div class="section-title">Donation history</div>
            <div class="section-badge" id="history-badge">0 donations</div>
          </div>
          <!-- Generated by profile.ts -->
          <div class="donation-list" id="donation-list"></div>
        </div>
      </div>

      <!-- SECTION 5: Sponsored Animals -->
      <div class="glow-card">
        <div class="glow-card-inner">
          <div class="section-head">
            <div class="section-title">Sponsored animals</div>
            <div class="section-badge" id="sponsor-badge">0 animals</div>
          </div>
          <!-- Generated by profile.ts -->
          <div class="sponsor-list" id="sponsor-list"></div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer__container">
      <div class="footer_top">
        <div class="footer__logo">
          <a href="../../pages/landing/index.html">
            <img src="../../assets/icons/ui/logo_zoo_white.png" alt="logo_zoo">
          </a>
          <a href="../../pages/landing/index.html">
            <img src="../../assets/icons/social/logo_yemdigital.png" alt="logo_yemdigital">
          </a>
          <a href="https://rs.school/">
            <img src="../../assets/icons/social/logo_rsschool.svg" alt="logo_rsschool">
          </a>
        </div>
        <div class="footer__list">
          <a href="../../pages/landing/index.html">About</a>
          <a href="../../pages/map/index.html">Map</a>
          <a href="../../pages/zoos/panda/index.html">Zoos</a>
          <a href="../../pages/contact/index.html">Contact Us</a>
        </div>
        <div class="donate">
          <button class="donate__btn">
            Donate for volunteers
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none">
              <line x1="2" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              <polyline points="13,5 21,12 13,19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="footer__socials--mobile">
          <a href="#"><img src="../../assets/icons/social/youtube.png" alt="youtube"></a>
          <a href="#"><img src="../../assets/icons/social/instagram.png" alt="instagram"></a>
          <a href="#"><img src="../../assets/icons/social/facebook.png" alt="facebook"></a>
        </div>
      </div>

      <hr class="footer_divider">

      <div class="footer__bottom">
        <div class="footer__copyright">
          <ul>
            <li>© 2021 Dinak</li>
            <li>© Yem Digital</li>
            <li>© Rsschool</li>
          </ul>
        </div>
        <div class="footer__socials">
          <a href="#"><img src="../../assets/icons/social/youtube.png" alt="youtube"></a>
          <a href="#"><img src="../../assets/icons/social/instagram.png" alt="instagram"></a>
          <a href="#"><img src="../../assets/icons/social/facebook.png" alt="facebook"></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="../../shared/scripts/navigation.js"></script>
  <script src="../../dist/bundle.js"></script>

</body>
</html>
